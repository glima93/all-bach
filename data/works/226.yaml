title: "Der Geist hilft unser Schwachheit auf"
key: "B-flat major"
collection: "Motets"
genre: motet
scoring: "Double choir (SATB/SATB), strings doubling choir I, 2 oboes, taille and bassoon doubling choir II, and continuo"
composed: "Leipzig, 1729; performed at the funeral of Johann Heinrich Ernesti on 20 October 1729"
movements:
  - "I. \"Der Geist hilft unser Schwachheit auf\""
