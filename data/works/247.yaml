notes: "The music is lost and only Picander's libretto survives; recordings are of reconstructions, which reuse music from the Trauer-Ode BWV 198 and other works. The reconstructions differ widely (e.g. Ton Koopman's, which composes new recitatives, versus Gordon Jones's or Diethard Hellmann's)."
