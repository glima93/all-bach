bwv: "247"
title: "St Mark Passion"
key: null
collection: "Passions"
genre: passion
scoring: "Lost; reconstructions use four-part choir (SATB), soloists, flutes, oboes, strings and continuo, after the Trauer-Ode BWV 198"
composed: "Leipzig; first performed on Good Friday, 23 March 1731, revised 1744"
