notes: "The prelude opens and the triple fugue closes Clavier-Übung III; the three flats, three themes and three fugal sections are commonly read as symbols of the Trinity. The nickname \"St Anne\" comes from the English hymn tune of that name, whose opening resembles the fugue subject."
