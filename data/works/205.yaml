bwv: "205"
title: "Zerreißet, zersprenget, zertrümmert die Gruft"
key: "D major"
collection: "Secular Cantatas"
genre: cantata
scoring: "Soloists (SATB), four-part choir, 3 trumpets, timpani, 2 horns, 2 flutes, 2 oboes (also oboe d'amore), viola d'amore, viola da gamba, strings and continuo"
composed: "Leipzig, first performed 3 August 1725"
movements:
  - "I. Chor der Winde \"Zerreißet, zersprenget, zertrümmert die Gruft\""
  - "II. Recitativo (Bass) \"Ja, ja! Die Stunden sind nunmehro nah\""
  - "III. Aria (Bass) \"Wie will ich lustig lachen\""
  - "IV. Recitativo (Tenor) \"Gefürcht'ter Äolus\""
  - "V. Aria (Tenor) \"Frische Schatten, meine Freude\""
  - "VI. Recitativo (Bass) \"Beinahe wirst du mich bewegen\""
  - "VII. Aria (Alt) \"Können nicht die roten Wangen\""
  - "VIII. Recitativo (Alt, Sopran) \"So willst du, grimmger Äolus\""
  - "IX. Aria (Sopran) \"Angenehmer Zephyrus\""
  - "X. Recitativo (Sopran, Bass) \"Mein Äolus, Ach!\""
  - "XI. Aria (Bass) \"Zurücke, zurücke, geflügelten Winde\""
  - "XII. Recitativo (Sopran, Alt, Tenor) \"Was Lust! Was Freude! Welch Vergnügen!\""
  - "XIII. Aria (Alt, Tenor) \"Zweig und Äste\""
  - "XIV. Recitativo (Sopran) \"Ja, ja! Ich lad euch selbst zu dieser Feier ein\""
  - "XV. Chor der Winde \"Vivat! August, August vivat!\""
notes: "Known as \"Aeolus Pacified\" (Der zufriedengestellte Äolus), a dramma per musica by Picander for the name day of the Leipzig professor August Friedrich Müller. Bach reused the music in 1734 for BWV 205a."
