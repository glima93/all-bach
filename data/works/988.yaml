notes: "An aria with thirty variations built on its bass line, not its melody. Every third variation is a canon, at intervals widening from the unison (Variatio 3) to the ninth (Variatio 27). The headings are Bach's own; 'a 1 Clav.' and 'a 2 Clav.' say whether a variation is played on one manual or two."
