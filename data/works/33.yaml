bwv: "33"
title: "Allein zu dir, Herr Jesu Christ"
key: "A minor"
collection: "Church Cantatas"
genre: cantata
scoring: "Soloists (ATB), four-part choir, 2 oboes, strings and continuo"
composed: "Leipzig; first performed on 3 September 1724 (Thirteenth Sunday after Trinity)"
movements:
  - "I. Coro \"Allein zu dir, Herr Jesu Christ\""
  - "II. Recitativo (Basso) \"Mein Gott und Richter\""
  - "III. Aria (Alto) \"Wie furchtsam wankten meine Schritte\""
  - "IV. Recitativo (Tenore) \"Mein Gott, verwirf mich nicht\""
  - "V. Aria (Duetto: Tenore, Basso) \"Gott, der du die Liebe heißt\""
  - "VI. Choral \"Ehr sei Gott in dem höchsten Thron\""
notes: "A chorale cantata from Bach's second Leipzig cycle, based on the hymn \"Allein zu dir, Herr Jesu Christ\" attributed to Konrad Hubert (1540); the outer stanzas are kept unchanged and the inner ones paraphrased by an unknown poet."
