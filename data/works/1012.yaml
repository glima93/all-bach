title: Cello Suite No. 6
key: D major
collection: Six Suites for Violoncello solo
genre: solo-instrumental
scoring: five-string instrument (C–G–d–a–e′); played today on a five-string cello, violoncello piccolo or a four-string cello
composed: Köthen, c. 1720
movements:
  - Prélude
  - Allemande
  - Courante
  - Sarabande
  - Gavotte I & II
  - Gigue
notes: Written for an instrument with a fifth, higher string. Which instrument Bach meant is still debated.
