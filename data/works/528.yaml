notes: "Part of the six trio sonatas Bach gathered in a Leipzig autograph, according to Forkel for his eldest son Wilhelm Friedemann. The first movement transcribes the sinfonia opening Part II of the cantata Die Himmel erzählen die Ehre Gottes, BWV 76, originally for oboe d'amore and viola da gamba."
