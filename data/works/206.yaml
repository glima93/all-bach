bwv: "206"
title: "Schleicht, spielende Wellen, und murmelt gelinde"
key: "D major"
collection: "Secular Cantatas"
genre: cantata
scoring: "Soloists (SATB), four-part choir, 3 trumpets, timpani, 3 flutes, 2 oboes (also oboes d'amore), strings and continuo"
composed: "Leipzig, 1736"
movements:
  - "I. Chorus \"Schleicht, spielende Wellen, und murmelt gelinde!\""
  - "II. Recitativo (Bass) \"O glückliche Veränderung!\""
  - "III. Aria (Bass) \"Schleuß des Janustempels Türen\""
  - "IV. Recitativo (Tenor) \"So recht! beglückter Weichselstrom!\""
  - "V. Aria (Tenor) \"Jede Woge meiner Wellen\""
  - "VI. Recitativo (Alt) \"Ich nehm zugleich an deiner Freude teil\""
  - "VII. Aria (Alt) \"Reis von Habsburgs hohem Stamme\""
  - "VIII. Recitativo (Sopran) \"Verzeiht, bemooste Häupter starker Ströme\""
  - "IX. Aria (Sopran) \"Hört doch! der sanften Flöten Chor\""
  - "X. Recitativo (Sopran, Alt, Tenor, Bass) \"Ich muß, ich will gehorsam sein\""
  - "XI. Chorus \"Die himmlische Vorsicht der ewigen Güte\""
notes: "A dramma per musica for the birthday of Augustus III, Elector of Saxony and King of Poland, in which four rivers of his lands sing his praise."
