bwv: "7"
title: "Christ unser Herr zum Jordan kam"
key: "E minor"
collection: "Church Cantatas"
genre: cantata
scoring: "Soloists (ATB), four-part choir, 2 oboes d'amore, 2 solo violins, strings and continuo"
composed: "Leipzig; first performed on 24 June 1724 (St John the Baptist's Day)"
movements:
  - "I. Coro \"Christ unser Herr zum Jordan kam\""
  - "II. Aria (Basso) \"Merkt und hört, ihr Menschenkinder\""
  - "III. Recitativo (Tenore) \"Dies hat Gott klar mit Worten und mit Bildern dargetan\""
  - "IV. Aria (Tenore) \"Des Vaters Stimme ließ sich hören\""
  - "V. Recitativo (Basso) \"Als Jesus dort nach seinen Leiden\""
  - "VI. Aria (Alto) \"Menschen, glaubt doch dieser Gnade\""
  - "VII. Choral \"Das Aug allein das Wasser sieht\""
notes: "The third cantata of Bach's chorale cantata cycle 1724–25, based on Martin Luther's baptism hymn \"Christ unser Herr zum Jordan kam\". The opening chorus, with the melody in the tenor, is shaped like an Italian violin concerto."
