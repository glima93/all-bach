collection: "Flute Sonatas and Partita"
genre: chamber
scoring: "Solo flute"
composed: "Probably c. 1723; the sole 18th-century source is a copy by two of Bach's copyists, possibly begun in Köthen c. 1722–23 and completed in Leipzig in 1723–24"
movements:
  - "I. Allemande"
  - "II. Corrente"
  - "III. Sarabande"
  - "IV. Bourrée anglaise"
notes: "The source is headed \"Solo p[our une] flûte traversière\"; the name \"Partita\" was given by 20th-century editors. Its writing for the flute is more demanding than the flute part of the fifth Brandenburg Concerto."
