bwv: "210"
title: "O holder Tag, erwünschte Zeit"
key: "A major"
collection: "Secular Cantatas"
genre: cantata
scoring: "Soprano, flute, oboe d'amore, strings and continuo"
composed: "Leipzig, c. 1740"
movements:
  - "I. Recitativo (Sopran) \"O holder Tag, erwünschte Zeit\""
  - "II. Aria (Sopran) \"Spielet, ihr beseelten Lieder\""
  - "III. Recitativo (Sopran) \"Doch, haltet ein, ihr muntern Saiten\""
  - "IV. Aria (Sopran) \"Ruhet hie, matte Töne\""
  - "V. Recitativo (Sopran) \"So glaubt man denn, daß die Musik verführe\""
  - "VI. Aria (Sopran) \"Schweigt, ihr Flöten, schweigt, ihr Töne\""
  - "VII. Recitativo (Sopran) \"Was Luft? was Grab?\""
  - "VIII. Aria (Sopran) \"Großer Gönner, dein Vergnügen\""
  - "IX. Recitativo (Sopran) \"Hochteurer Mann, so fahre ferner fort\""
  - "X. Aria (Sopran) \"Seid beglückt, edle beide\""
notes: "A wedding cantata for solo soprano whose arias praise music itself, adapted from the homage cantata O angenehme Melodei (BWV 210a); the librettist is unknown."
