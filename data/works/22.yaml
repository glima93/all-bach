bwv: "22"
title: "Jesus nahm zu sich die Zwölfe"
key: "G minor"
collection: "Church Cantatas"
genre: cantata
scoring: "Soloists (ATB), four-part choir, oboe, strings and continuo"
composed: "Leipzig; first performed on 7 February 1723 (Estomihi)"
movements:
  - "I. Arioso (Tenore, Basso) e Coro \"Jesus nahm zu sich die Zwölfe und sprach\""
  - "II. Aria (Alto) \"Mein Jesu, ziehe mich nach dir\""
  - "III. Recitativo (Basso) \"Mein Jesu, ziehe mich, so werd ich laufen\""
  - "IV. Aria (Tenore) \"Mein alles in allem, mein ewiges Gut\""
  - "V. Choral \"Ertöt uns durch dein Güte\""
notes: "One of the two audition pieces, with BWV 23, that Bach performed for the post of Thomaskantor; the score is marked \"Das ist das Probe-Stück für Leipzig\". Text by an unknown poet, closing with a stanza of Elisabeth Cruciger's \"Herr Christ, der einig Gotts Sohn\"."
