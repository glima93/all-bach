bwv: "37"
title: "Wer da gläubet und getauft wird"
key: "A major"
collection: "Church Cantatas"
genre: cantata
scoring: "Soloists (SATB), four-part choir, 2 oboes d'amore, strings and continuo"
composed: "Leipzig; first performed on 18 May 1724 (Ascension)"
movements:
  - "I. Coro \"Wer da gläubet und getauft wird, der wird selig werden\""
  - "II. Aria (Tenore) \"Der Glaube ist das Pfand der Liebe\""
  - "III. Choral (Soprano, Alto) \"Herr Gott Vater, mein starker Held!\""
  - "IV. Recitativo (Basso) \"Ihr Sterblichen, verlanget ihr\""
  - "V. Aria (Basso) \"Der Glaube schafft der Seele Flügel\""
  - "VI. Choral \"Den Glauben mir verleihe\""
notes: "Bach's first cantata for Ascension, from his first Leipzig cycle, on a text by an unknown poet. The solo violin part of the tenor aria is lost and is usually reconstructed in performance."
