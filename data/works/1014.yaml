bwv: "1014"
title: "Sonata for Violin and Harpsichord No. 1 in B minor"
key: "B minor"
collection: "Sonatas for violin and harpsichord"
genre: chamber
scoring: "Violin and obbligato harpsichord"
composed: "Probably Köthen, c. 1720–23; earliest surviving source a 1725 copy largely by Johann Heinrich Bach, with later revisions in Leipzig"
movements:
  - "I. Adagio"
  - "II. Allegro"
  - "III. Andante"
  - "IV. Allegro"
notes: "The first of the six sonatas BWV 1014–1019, in which the harpsichord plays a fully written-out obbligato part rather than a figured-bass accompaniment, making the works effectively trios for two upper voices and bass. The closing Allegro is a fugue whose subject is inverted in the second half."
