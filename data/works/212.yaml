bwv: "212"
title: "Mer hahn en neue Oberkeet"
key: "A major"
collection: "Secular Cantatas"
genre: cantata
scoring: "Soprano, bass, horn, flute, violin, viola and continuo"
composed: "Kleinzschocher near Leipzig, 30 August 1742"
movements:
  - "I. Ouvertüre"
  - "II. Aria (Duetto Sopran, Bass) \"Mer hahn en neue Oberkeet\""
  - "III. Recitativo (Sopran, Bass) \"Nu, Mieke, gib dein Guschel immer her\""
  - "IV. Aria (Sopran) \"Ach, es schmeckt doch gar zu gut\""
  - "V. Recitativo (Bass) \"Der Herr ist gut\""
  - "VI. Aria (Bass) \"Ach, Herr Schösser, geht nicht gar zu schlimm\""
  - "VII. Recitativo (Sopran) \"Es bleibt dabei\""
  - "VIII. Aria (Sopran) \"Unser trefflicher, lieber Kammerherr\""
  - "IX. Recitativo (Sopran, Bass) \"Er hilft uns allen, alt und jung\""
  - "X. Aria (Sopran) \"Das ist galant\""
  - "XI. Recitativo (Bass) \"Und unsre gnädge Frau\""
  - "XII. Aria (Bass) \"Fünfzig Taler bares Geld\""
  - "XIII. Recitativo (Sopran) \"Im Ernst ein Wort\""
  - "XIV. Aria (Sopran) \"Klein-Zschocher müsse\""
  - "XV. Recitativo (Bass) \"Das ist zu klug vor dich\""
  - "XVI. Aria (Bass) \"Es nehme zehntausend Dukaten\""
  - "XVII. Recitativo (Sopran) \"Das klingt zu liederlich\""
  - "XVIII. Aria (Sopran) \"Gib, Schöne, viel Söhne\""
  - "XIX. Recitativo (Bass) \"Du hast wohl recht\""
  - "XX. Aria (Bass) \"Dein Wachstum sei feste und lache vor Lust\""
  - "XXI. Recitativo (Sopran, Bass) \"Und damit sei es auch genug\""
  - "XXII. Aria (Sopran) \"Und daß ihrs alle wißt\""
  - "XXIII. Recitativo (Sopran, Bass) \"Mein Schatz! erraten\""
  - "XXIV. Chor (Sopran, Bass) \"Wir gehn nun, wo der Tudelsack\""
notes: "Known as the \"Peasant Cantata\", a cantata burlesque in Saxon dialect by Picander, written in homage to Carl Heinrich von Dieskau, new lord of the manor of Kleinzschocher. Bach's last known secular cantata."
