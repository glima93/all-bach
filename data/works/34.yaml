  - "IV. Recitativo (Basso) \"Erwählt sich Gott die heilgen Hütten\""
  - "V. Coro \"Friede über Israel\""
notes: "Pentecost cantata on a text by an unknown author; the surviving score dates from Bach's revival around 1746. Movements 1, 3 and 5 were reused in the wedding cantata of the same title, BWV 34a (1726)."
