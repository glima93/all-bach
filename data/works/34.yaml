title: "O ewiges Feuer, o Ursprung der Liebe"
key: "D major"
collection: "Church Cantatas"
genre: cantata
scoring: "Soloists (ATB), four-part choir, 3 trumpets, timpani, 2 flutes, 2 oboes, strings and continuo"
composed: "Leipzig; first performed on 1 June 1727 (Pentecost); revived c.1746"
movements:
  - "I. Coro \"O ewiges Feuer, o Ursprung der Liebe\""
  - "II. Recitativo (Tenore) \"Herr, unsre Herzen halten dir\""
