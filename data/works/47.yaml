bwv: "47"
title: "Wer sich selbst erhöhet, der soll erniedriget werden"
key: "G minor"
collection: "Church Cantatas"
genre: cantata
scoring: "Soloists (SB), four-part choir, 2 oboes, obbligato organ, strings and continuo"
composed: "Leipzig; first performed on 13 October 1726 (Seventeenth Sunday after Trinity)"
movements:
  - "I. Coro \"Wer sich selbst erhöhet, der soll erniedriget werden\""
  - "II. Aria (Soprano) \"Wer ein wahrer Christ will heißen\""
  - "III. Recitativo (Basso) \"Der Mensch ist Kot, Stank, Asch und Erde\""
  - "IV. Aria (Basso) \"Jesu, beuge doch mein Herze\""
  - "V. Choral \"Der zeitlichen Ehrn will ich gern entbehrn\""
notes: "From Bach's third cycle, on a text by Johann Friedrich Helbig, the only one of his that Bach set; the closing chorale is from \"Warum betrübst du dich, mein Herz\". The soprano aria has an obbligato organ part, later given to a solo violin."
