title: Brandenburg Concerto No. 5
key: D major
collection: Brandenburg Concertos
genre: orchestral
scoring: flute, violin and harpsichord soloists, strings and continuo
composed: Weimar and Köthen; the dedication score to Christian Ludwig, Margrave of Brandenburg, is dated 24 March 1721
movements:
  - "I. Allegro"
  - "II. Affettuoso"
  - "III. Allegro"
notes: The harpsichord's long solo cadenza near the end of the first movement makes this one of the first keyboard concertos.
