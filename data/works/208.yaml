bwv: "208"
title: "Was mir behagt, ist nur die muntre Jagd"
key: "F major"
collection: "Secular Cantatas"
genre: cantata
scoring: "Soloists (SSTB), four-part choir, 2 horns, 2 recorders, 2 oboes, taille, bassoon, strings and continuo"
composed: "Weimar, 1713"
movements:
  - "I. Recitativo (Sopran I) “Was mir behagt, ist nur die muntre Jagd!”"
  - "II. Aria (Sopran I) “Jagen ist die Lust der Götter”"
  - "III. Recitativo (Tenor) “Wie? Schönste Göttin! Wie?”"
  - "IV. Aria (Tenor) “Willst du dich nicht mehr ergötzen”"
  - "V. Recitativo (Sopran I, Tenor) “Ich liebe dich zwar noch!”"
  - "VI. Recitativo (Bass) “Ich, der ich sonst ein Gott in diesen Feldern bin”"
  - "VII. Aria (Bass) “Ein Fürst ist seines Landes Pan!”"
  - "VIII. Recitativo (Sopran II) “Soll denn der Pales Opfer hier das letzte sein?”"
  - "IX. Aria (Sopran II) “Schafe können sicher weiden”"
  - "X. Recitativo (Sopran I) “So stimmt mit ein”"
  - "XI. Chorus (Aria a 4) “Lebe, Sonne dieser Erden”"
  - "XII. Duetto (Sopran I, Tenor) “Entzücket uns beide”"
  - "XIII. Aria (Sopran II) “Weil die wollenreichen Herden”"
  - "XIV. Aria (Bass) “Ihr Felder und Auen, laßt grünend euch schauen”"
  - "XV. Chorus “Ihr lieblichste Blicke! ihr freudige Stunden”"
notes: "Known as the \"Hunting Cantata\", written to a text by Salomon Franck for the birthday of Duke Christian of Saxe-Weissenfels; Bach's earliest surviving secular cantata. It contains the soprano aria \"Schafe können sicher weiden\" (\"Sheep may safely graze\")."
