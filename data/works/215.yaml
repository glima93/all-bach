bwv: "215"
title: "Preise dein Glücke, gesegnetes Sachsen"
key: "D major"
collection: "Secular Cantatas"
genre: cantata
scoring: "Soloists (STB), double choir (SATB/SATB), 3 trumpets, timpani, 2 flutes, 2 oboes (also oboes d'amore), strings and continuo"
composed: "Leipzig, first performed 5 October 1734"
movements:
  - "I. Coro I/II \"Preise dein Glücke, gesegnetes Sachsen\""
  - "II. Recitativo (Tenor) \"Wie können wir, großmächtigster August\""
  - "III. Aria (Tenor) \"Freilich trotzt Augustus' Name\""
  - "IV. Recitativo (Bass) \"Was hat dich sonst, Sarmatien, bewogen\""
  - "V. Aria (Bass) \"Rase nur, verwegner Schwarm\""
  - "VI. Recitativo (Sopran) \"Ja, ja! Gott ist uns noch mit seiner Hülfe nah\""
  - "VII. Aria (Sopran) \"Durch die von Eifer entflammeten Waffen\""
  - "VIII. Recitativo (Sopran, Tenor, Bass) \"Laß doch, o teurer Landesvater, zu\""
  - "IX. Coro I/II \"Stifter der Reiche, Beherrscher der Kronen\""
notes: "Written at short notice to a text by Johann Christoph Clauder for the anniversary of the election of Augustus III as King of Poland, and performed in the king's presence. Its soprano aria \"Durch die von Eifer entflammeten Waffen\" became the bass aria \"Erleucht auch meine finstre Sinnen\" in Part V of the Christmas Oratorio, BWV 248, and the opening chorus the Osanna of the Mass in B minor."
