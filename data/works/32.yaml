bwv: "32"
title: "Liebster Jesu, mein Verlangen"
key: "E minor"
collection: "Church Cantatas"
genre: cantata
scoring: "Soloists (SB), four-part choir, oboe, strings and continuo"
composed: "Leipzig; first performed on 13 January 1726 (First Sunday after Epiphany)"
movements:
  - "I. Aria (Soprano) \"Liebster Jesu, mein Verlangen\""
  - "II. Recitativo (Basso) \"Was ists, dass du mich gesuchet?\""
  - "III. Aria (Basso) \"Hier, in meines Vaters Stätte\""
  - "IV. Recitativo (Dialog: Soprano, Basso) \"Ach! heiliger und großer Gott\""
  - "V. Aria (Duetto: Soprano, Basso) \"Nun verschwinden alle Plagen\""
  - "VI. Choral \"Mein Gott, öffne mir die Pforten\""
notes: "A dialogue cantata (\"Concerto in Dialogo\") between the Soul (soprano) and Jesus (bass), on a text by Georg Christian Lehms (1711) based on the finding of Jesus in the Temple. It closes with the last stanza of Paul Gerhardt's \"Weg, mein Herz, mit den Gedanken\"."
