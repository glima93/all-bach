genre: oratorio
scoring: "Four-part choir (SATB), soloists, 2 flutes, 2 oboes (also oboes d'amore and da caccia), 2 horns, 3 trumpets, timpani, strings and continuo"
composed: "Leipzig; six parts first performed on the feast days between Christmas Day, 25 December 1734, and Epiphany, 6 January 1735"
