bwv: "40"
title: "Darzu ist erschienen der Sohn Gottes"
key: "F major"
collection: "Church Cantatas"
genre: cantata
scoring: "Soloists (ATB), four-part choir, 2 horns, 2 oboes, strings and continuo"
composed: "Leipzig; first performed on 26 December 1723 (Second Day of Christmas)"
movements:
  - "I. Coro \"Darzu ist erschienen der Sohn Gottes\""
  - "II. Recitativo (Tenore) \"Das Wort ward Fleisch\""
  - "III. Choral \"Die Sünd macht Leid\""
  - "IV. Aria (Basso) \"Höllische Schlange\""
  - "V. Recitativo (Alto) \"Die Schlange, so im Paradies\""
  - "VI. Choral \"Schüttle deinen Kopf und sprich\""
  - "VII. Aria (Tenore) \"Christenkinder, freuet euch!\""
  - "VIII. Choral \"Jesu, nimm dich deiner Glieder\""
notes: "Bach's first Christmas cantata for Leipzig, from his first cycle, on a text by an unknown poet with three chorale stanzas from three different hymns. The opening chorus was later reworked as the \"Cum Sancto Spiritu\" of the Missa in F major, BWV 233."
