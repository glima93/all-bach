bwv: "243a"
title: "Magnificat in E-flat major"
key: "E-flat major"
collection: "Magnificat"
genre: mass
scoring: "Five-part choir (SSATB), soloists, 3 trumpets, timpani, 2 recorders, 2 oboes, strings and continuo"
composed: "Leipzig, 1723; heard with its Christmas interpolations on 25 December 1723, though probably first performed on 2 July 1723, the Feast of the Visitation"
movements:
  - "I. Coro \"Magnificat anima mea Dominum\""
  - "IIa. Aria (Sopran II) \"Et exsultavit\""
  - "IIb. Coro (a-cappella) \"Vom Himmel hoch\""
  - "III. Aria (Sopran I) \"Quia respexit\""
  - "IV. Coro \"Omnes generationes\""
  - "Va. Aria (Bass) \"Quia fecit mihi magna\""
  - "Vb. Coro \"Freut euch und jubiliert\""
  - "VI. Aria (Alt, Tenor) \"Et misericordia\""
  - "VIIa. Coro \"Fecit potentiam\""
  - "VIIb. Coro \"Gloria in excelsis Deo\""
  - "VIII. Aria (Tenor) \"Deposuit potentes\""
  - "IXa. Aria (Alt) \"Esurientes implevit bonis\""
  - "IXb. Aria (Sopran, Bass) \"Virga Jesse floruit\""
  - "X. Aria (Sopran I, Sopran II, Alt) \"Suscepit Israel\""
  - "XI. Coro \"Sicut locutus est\""
  - "XII. Coro \"Gloria Patri et filio\""
notes: "The original version of the Magnificat, with recorders in the Esurientes. For Christmas Bach added four interpolations (\"Vom Himmel hoch\", \"Freut euch und jubiliert\", \"Gloria in excelsis Deo\" and \"Virga Jesse floruit\"); his later D major revision without them is BWV 243."
