bwv: "1005"
title: Violin Sonata No. 3
key: C major
collection: Sonatas and Partitas for solo violin
genre: solo-instrumental
scoring: violin solo
composed: Köthen, autograph fair copy dated 1720
movements:
  - Adagio
  - Fuga (Alla breve)
  - Largo
  - Allegro assai
notes: Its fugue, on the chorale "Komm, Heiliger Geist, Herre Gott", is the longest Bach wrote for solo violin. Bach arranged the opening Adagio for harpsichord as BWV 968.
