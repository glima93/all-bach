bwv: "201"
title: "Geschwinde, ihr wirbelnden Winde"
key: "D major"
collection: "Secular Cantatas"
genre: cantata
scoring: "Six soloists (SATTBB), four-part choir, 3 trumpets, timpani, 2 flutes, 2 oboes (also oboe d'amore), strings and continuo"
composed: "Leipzig, c. 1729"
movements:
  - "I. Coro \"Geschwinde, ihr wirbelnden Winde\""
  - "II. Recitativo (Sopran e Bass I+II) \"Und du bist doch so unverschämt und frei\""
  - "III. Aria (Sopran) \"Patron, das macht der Wind\""
  - "IV. Recitativo (Alt e Bass I+II) \"Was braucht ihr euch zu zanken\""
  - "V. Aria (Bass I) \"Mit Verlangen drück ich deine zarten Wangen\""
  - "VI. Recitativo (Sopran e Bass II) \"Pan, rücke deine Kehle nun\""
  - "VII. Aria (Bass II) \"Zu Tanze, zu Sprunge\""
  - "VIII. Recitativo (Alt e Tenor I) \"Nunmehro Richter her\""
  - "IX. Aria (Tenor I) \"Phoebus, deine Melodie\""
  - "X. Recitativo (Tenor II e Bass II) \"Komm, Midas, sage du nun an\""
  - "XI. Aria (Tenor II) \"Pan ist Meister, laßt ihn gehn\""
  - "XII. Recitativo (Tutti) \"Wie, Midas, bist du toll\""
  - "XIII. Aria (Alt) \"Aufgeblasne Hitze\""
  - "XIV. Recitativo (Sopran) \"Du guter Midas, geh nun hin\""
  - "XV. Coro \"Labt das Herz, ihr holden Saiten\""
notes: "A dramma per musica on Picander's text, known as \"Phoebus and Pan\" (Der Streit zwischen Phoebus und Pan), after Ovid's tale of the singing contest judged by Midas. Probably written for Bach's Collegium Musicum."
