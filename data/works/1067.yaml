bwv: "1067"
title: Orchestral Suite No. 2
key: B minor
collection: Orchestral Suites
genre: orchestral
scoring: Flute, strings and continuo
composed: Leipzig, late 1730s; the surviving parts date from about 1738–39
movements:
  - "I. Ouverture"
  - "II. Rondeau"
  - "III. Sarabande"
  - "IV. Bourrée I & II"
  - "V. Polonaise & Double"
  - "VI. Menuet"
  - "VII. Badinerie"
notes: Close to a flute concerto in all but name, ending with the Badinerie. Some scholars think it was first in A minor with a violin as soloist.
