bwv: "1047"
title: Brandenburg Concerto No. 2
key: F major
collection: Brandenburg Concertos
genre: orchestral
scoring: trumpet, recorder, oboe and violin soloists, strings and continuo
composed: Weimar and Köthen; the dedication score to Christian Ludwig, Margrave of Brandenburg, is dated 24 March 1721
movements:
  - "I. Allegro"
  - "II. Andante"
  - "III. Allegro assai"
notes: The high trumpet part is among the hardest in the Baroque repertoire; the slow movement leaves the trumpet out. The first movement carries no tempo marking in Bach's score.
