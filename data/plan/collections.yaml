# The whole BWV catalogue (BWV 1–1128), split into the collections the shelf will show.
#
# Every BWV number from 1 to 1128 belongs to exactly one collection; `python scripts/plan_coverage.py`
# checks that. Numbers are BWV2a (1998), the numbering MusicBrainz and most recordings use. Lost works and
# vacant numbers stay in their collection: they simply get no recordings.
#
# Fields
#   id        short name, also used for the snapshot file (data/sources/musicbrainz-<id>.json)
#   title     shelf title
#   chapter   BWV chapter, used to group volumes on the shelf
#   bwv       numbers and ranges ("1066-1071")
#   mode      how the importer reads performers (see docs/catalogue-plan.md, "Importer modes")
#   native    chamber mode only: the solo part's instruments, the written one first
#   mb_parent MusicBrainz parent work, when there is one; otherwise works are found by BWV number
#   wave      1 = instrumental, existing pipeline; 2 = needs the vocal mode; 3 = long tail
#   run       the scheduled run that collects it (runs go in order; small collections share a run)
#   status    done | todo | queued (for the GitHub collector) | collected | imported
#   note      anything a run must know

collections:

# ── Already on the site ──────────────────────────────────────────────────────────────────
- {id: wtc, title: "The Well-Tempered Clavier", chapter: Keyboard, bwv: ["846-893"], mode: keyboard, wave: 0, run: 0, status: done}
- {id: goldberg, title: "Goldberg Variations", chapter: Keyboard, bwv: ["988"], mode: keyboard, wave: 0, run: 0, status: done}
- {id: violin-solo, title: "Sonatas and Partitas for solo violin", chapter: Chamber, bwv: ["1001-1006"], mode: solo, wave: 0, run: 0, status: done}
- {id: cello-suites, title: "Six Suites for Violoncello solo", chapter: Chamber, bwv: ["1007-1012"], mode: solo, wave: 0, run: 0, status: done}
- {id: brandenburg, title: "Brandenburg Concertos", chapter: Orchestral, bwv: ["1046-1051"], mode: ensemble, mb_parent: 7481c7f5-71bd-464e-956a-c670f4117de3, wave: 0, run: 0, status: done}

