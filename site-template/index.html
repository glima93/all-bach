<title>All Bach</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="description" content="An open, BWV-ordered archive of recordings of Johann Sebastian Bach, with links to where each can be heard.">

<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Gloock&family=IBM+Plex+Mono:wght@400;500&family=Public+Sans:ital,wght@0,400;0,500;0,600;1,400&display=swap">
<style>
/* A library shelf. The home page is a row of cloth-bound volumes, one per collection; a volume
   opens to its cover and the works inside; each work opens to its sheet of recordings. */
:root {
  --paper: #f0eadb;
  --sheet: #f9f5ec;
  --ink: #24201a;
  --muted: #6b6254;
  --rule: #d8ceb9;
  --prussian: #24507f;
  --prussian-soft: #e0e3e0;
  --draft: #85560f;
  --draft-soft: #f0e0c0;
  --focus: #2f6db0;
  --gilt: #e4cb8f;
  --gilt-soft: rgba(228, 203, 143, 0.55);
  --plank: #8c6b47;
  --plank-dark: #6c5034;
  --f-display: "Gloock", "Iowan Old Style", Georgia, serif;
  --f-body: "Public Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
  --f-mono: "IBM Plex Mono", ui-monospace, "SF Mono", Menlo, monospace;
  --s-1: 0.8125rem; --s0: 1rem; --s1: 1.25rem; --s2: 1.75rem; --s3: 2.75rem; --s4: clamp(4rem, 14vw, 8.5rem);
  --tint: 0%;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --paper: #1b1915; --sheet: #23201b; --ink: #ece5d6; --muted: #a69d8b; --rule: #3a352d;
    --prussian: #9cbde3; --prussian-soft: #26303a; --draft: #e3b467; --draft-soft: #382c1a; --focus: #9cc2f0;
    --plank: #5e4630; --plank-dark: #47341f; --tint: 50%;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --paper: #1b1915; --sheet: #23201b; --ink: #ece5d6; --muted: #a69d8b; --rule: #3a352d;
  --prussian: #9cbde3; --prussian-soft: #26303a; --draft: #e3b467; --draft-soft: #382c1a; --focus: #9cc2f0;
  --plank: #5e4630; --plank-dark: #47341f; --tint: 50%;
  color-scheme: dark;
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
body {
  margin: 0;
  background: var(--paper); color: var(--ink);
  font-family: var(--f-body); font-size: var(--s0); line-height: 1.55;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
}
.wrap { max-width: 1000px; margin: 0 auto; padding-block: 28px 64px; }
a { color: var(--prussian); text-underline-offset: 3px; }
a:focus-visible, button:focus-visible { outline: 2px solid var(--focus); outline-offset: 3px; border-radius: 3px; }
h1, h2, h3 { text-wrap: balance; margin: 0; font-weight: 400; }
.mono { font-family: var(--f-mono); font-variant-numeric: tabular-nums; }
.label { font-size: var(--s-1); color: var(--muted); font-weight: 500; }
/* a collection's own colour, readable as text on paper in both themes */
.inked { color: color-mix(in srgb, var(--cloth, var(--prussian)), white var(--tint)); }

/* masthead */
.mast { display: flex; flex-wrap: wrap; align-items: baseline; justify-content: space-between; gap: 12px 24px; padding-bottom: 18px; }
.brand { font-family: var(--f-display); font-size: var(--s2); color: var(--ink); text-decoration: none; letter-spacing: -0.01em; }
nav.top { display: flex; gap: 22px; font-size: 0.95rem; font-weight: 500; }
nav.top a { color: var(--muted); text-decoration: none; }
nav.top a:hover { color: var(--ink); }
nav.top a[aria-current="page"] { color: var(--ink); text-decoration: underline; text-decoration-thickness: 1.5px; text-underline-offset: 6px; }

/* home */
.lede { padding-block: 48px 28px; max-width: 40rem; }
.lede h1 { font-family: var(--f-display); font-size: clamp(2.4rem, 6vw, 3.6rem); line-height: 1.02; letter-spacing: -0.015em; }
.lede p { color: var(--muted); font-size: 1.075rem; max-width: 56ch; margin: 18px 0 0; }

/* search */
.finder { display: grid; gap: 8px; padding-block: 4px 44px; max-width: 46rem; }
.finder label { font-weight: 500; }
.finder input { font: 400 1.125rem/1.3 var(--f-body); color: var(--ink); background: var(--sheet); border: 1.5px solid var(--rule); border-radius: 10px; padding: 14px 16px; width: 100%; min-width: 0; }
.finder input::placeholder { color: var(--muted); }
.finder input:focus-visible { outline: 3px solid var(--prussian-soft); outline-offset: 0; border-color: var(--prussian); }
.try { display: flex; flex-wrap: wrap; align-items: center; gap: 6px; margin: 2px 0 0; font-size: var(--s-1); color: var(--muted); }
.try button { font: 500 var(--s-1)/1 var(--f-body); color: var(--prussian); background: transparent; border: 1px solid var(--rule); border-radius: 999px; padding: 6px 10px; cursor: pointer; }
.try button:hover { background: var(--sheet); }
.hits-head { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 16px; padding-bottom: 12px; border-bottom: 1.5px solid var(--ink); }
.hits-head p { margin: 0; font-size: var(--s1); }
.hits-head .tags { margin: 0; }
.hits { list-style: none; margin: 0 0 16px; padding: 0; }
.hit { display: grid; grid-template-columns: 6rem minmax(0, 1fr) minmax(0, 1.2fr) auto; gap: 6px 18px; align-items: baseline; padding: 12px 4px; border-bottom: 1px solid var(--rule); }
.hit .yr { font-size: 0.95rem; }
.hit .yr.unknown { color: var(--muted); }
.hit .who { min-width: 0; }
.hit .meta { color: var(--muted); font-size: 0.88rem; }
.wk { display: flex; flex-wrap: wrap; gap: 4px; min-width: 0; }
.wchip { font-size: 0.78rem; text-decoration: none; padding: 3px 7px; border-radius: 4px; background: var(--prussian-soft); color: var(--prussian); white-space: nowrap; }
.wchip b { font-weight: 500; }
.wchip i { font-style: normal; color: var(--draft); }
.wchip:hover { outline: 1px solid var(--prussian); }
.hit .listen a { font-size: 0.85rem; font-weight: 600; text-decoration: none; padding: 5px 10px; border: 1px solid var(--prussian); border-radius: 6px; white-space: nowrap; }
.more { margin-bottom: 24px; }
@media (max-width: 640px) {
  .hit { grid-template-columns: 4.5rem minmax(0, 1fr); }
  .hit .wk, .hit .listen { grid-column: 2; }
}

/* the shelf */
.shelf-head { display: flex; flex-wrap: wrap; align-items: baseline; justify-content: space-between; gap: 6px 20px; margin-bottom: 22px; }
.shelf-head h2 { font-family: var(--f-display); font-size: var(--s2); }
.shelf-head p { margin: 0; color: var(--muted); font-size: 0.95rem; }
.shelf { list-style: none; margin: 0; padding: 0 22px; display: flex; align-items: flex-end; gap: 5px; min-height: 420px; }
.shelf li { display: flex; }
.spine {
  position: relative; display: grid; grid-template-rows: auto minmax(0, 1fr) auto; justify-items: center; gap: 10px;
  width: var(--w, 84px); height: var(--h, 380px); padding: 16px 8px 14px;
  color: var(--gilt); text-decoration: none; border-radius: 3px 3px 1px 1px;
  background-color: var(--cloth);
  background-image:
    linear-gradient(90deg, rgba(0,0,0,0.28), rgba(255,255,255,0.09) 16%, rgba(255,255,255,0) 42%, rgba(0,0,0,0.08) 78%, rgba(0,0,0,0.3)),
    repeating-linear-gradient(0deg, rgba(255,255,255,0.035) 0 1px, transparent 1px 3px),
    repeating-linear-gradient(90deg, rgba(0,0,0,0.04) 0 1px, transparent 1px 3px);
  box-shadow: 0 1px 0 rgba(0,0,0,0.25), 2px 0 0 rgba(0,0,0,0.12);
  view-transition-name: var(--vt);
}
/* raised bands, doubled in gilt */
.spine::before, .spine::after { content: ""; position: absolute; left: 7px; right: 7px; height: 5px; border-block: 1px solid var(--gilt-soft); }
.spine::before { top: 8px; }
.spine::after { bottom: 7px; }
.spine .lab { font: 500 0.78rem/1.25 var(--f-mono); text-align: center; padding: 5px 6px; margin-top: 8px; background: rgba(0,0,0,0.22); border: 1px solid var(--gilt-soft); border-radius: 1px; min-width: 3.4em; }
.spine .lab i { display: block; font-style: normal; opacity: 0.6; line-height: 0.6; }
.spine .ti { writing-mode: vertical-rl; font-family: var(--f-display); font-size: 1.22rem; line-height: 1.12; text-align: center; align-self: center; max-height: 100%; overflow: hidden; letter-spacing: 0.01em; }
.spine .ft { font: 500 0.74rem/1.15 var(--f-mono); text-align: center; margin-bottom: 8px; }
.spine .ft span { display: block; font-family: var(--f-body); opacity: 0.75; }
.spine.ghost { background: transparent; color: var(--muted); border: 1.5px dashed var(--rule); box-shadow: none; }
.spine.ghost::before, .spine.ghost::after { display: none; }
.spine.ghost .ti { font-family: var(--f-body); font-size: 0.95rem; }
.spine:focus-visible { outline: 2px solid var(--focus); outline-offset: 4px; }
@media (prefers-reduced-motion: no-preference) {
  .spine { transition: transform 0.18s ease-out; }
  .spine:hover, .spine:focus-visible { transform: translateY(-12px); }
}
.shelf-scroll { overflow-x: auto; overflow-y: hidden; padding-top: 14px; scrollbar-width: thin; }
.shelf-scroll:focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; }
.shelf-inner { min-width: max-content; }
.plank { height: 16px; margin: 0 0 18px; background: linear-gradient(var(--plank), var(--plank-dark)); border-radius: 2px; box-shadow: 0 14px 18px -12px rgba(60, 40, 20, 0.45); }
.shelf-note { margin: 28px 0 0; color: var(--muted); font-size: 0.95rem; max-width: 62ch; }
@media (max-width: 640px) {
  /* on a narrow screen the volumes stay upright, a little smaller, and the shelf scrolls sideways */
  .shelf-scroll { margin-inline: -16px; padding-inline: 16px; }
  .shelf { padding: 0 12px; min-height: 340px; gap: 4px; }
  .spine { width: calc(var(--w, 84px) * 0.82); height: calc(var(--h, 380px) * 0.82); padding: 14px 6px 12px; }
  .spine .ti { font-size: 1.05rem; }
  .spine .lab { font-size: 0.7rem; padding: 4px; min-width: 0; }
  .shelf-note { margin-top: 20px; }
}
/* a collection: its cover, then the works inside */
.back { display: inline-block; margin-top: 18px; font-size: 0.95rem; font-weight: 500; text-decoration: none; }
.back:hover { text-decoration: underline; }
.cover {
  position: relative; margin-top: 18px; padding: clamp(36px, 7vw, 64px) clamp(28px, 6vw, 60px);
  color: var(--gilt); border-radius: 3px 8px 8px 3px;
  background-color: var(--cloth);
  background-image:
    linear-gradient(90deg, rgba(0,0,0,0.3), rgba(0,0,0,0) 4%, rgba(255,255,255,0.05) 6%, rgba(0,0,0,0) 30%),
    repeating-linear-gradient(0deg, rgba(255,255,255,0.03) 0 1px, transparent 1px 3px),
    repeating-linear-gradient(90deg, rgba(0,0,0,0.04) 0 1px, transparent 1px 3px);
  box-shadow: 0 18px 30px -22px rgba(40, 25, 10, 0.6);
  view-transition-name: var(--vt);
}
.cover::before { content: ""; position: absolute; inset: 14px; border: 1px solid var(--gilt-soft); outline: 1px solid var(--gilt-soft); outline-offset: -5px; pointer-events: none; }
.cover .range { font-family: var(--f-mono); font-size: 0.95rem; opacity: 0.85; }
.cover h1 { font-family: var(--f-display); font-size: clamp(2.2rem, 6.5vw, 3.8rem); line-height: 1.02; margin-top: 10px; max-width: 18ch; }
.cover p { margin: 18px 0 0; max-width: 52ch; color: #efe2bf; opacity: 0.9; }
.works { list-style: none; margin: 32px 0 0; padding: 0; display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 210px), 1fr)); gap: 14px; }
.wcard { display: grid; align-content: start; gap: 2px; height: 100%; padding: 18px 18px 16px; color: inherit; text-decoration: none; background: var(--sheet); border: 1px solid var(--rule); border-top: 4px solid var(--cloth); border-radius: 2px 2px 8px 8px; }
.wcard:hover { border-color: color-mix(in srgb, var(--cloth), transparent 40%); border-top-color: var(--cloth); }
.wcard .n { font-family: var(--f-display); font-size: 2.3rem; line-height: 1; margin-bottom: 10px; }
.wcard strong { font-weight: 600; font-size: 1.05rem; line-height: 1.3; }
.wcard .sub { color: var(--muted); font-size: 0.92rem; }
.wcard .cnt { margin-top: 12px; font-size: 0.88rem; color: var(--muted); }
.wcard .cnt b { color: var(--ink); font-weight: 600; }

/* work sheet */
.sheet { display: grid; grid-template-columns: auto minmax(0, 1fr); gap: 8px 36px; align-items: end; padding-block: 22px 30px; border-bottom: 1.5px solid var(--ink); }
.bwv { font-family: var(--f-display); font-size: var(--s4); line-height: 0.85; letter-spacing: -0.02em; }
.bwv small { display: block; font-family: var(--f-mono); font-size: var(--s-1); letter-spacing: 0.12em; color: var(--muted); margin-bottom: 10px; }
.sheet .col { font-size: 0.95rem; color: var(--muted); margin-bottom: 6px; }
.sheet .col a { color: inherit; }
.sheet h1 { font-family: var(--f-display); font-size: var(--s3); line-height: 1.05; }
.sheet .key { font-size: var(--s1); color: var(--muted); margin-top: 6px; }
@media (max-width: 640px) { .sheet { grid-template-columns: 1fr; } }

.facts { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 20px 32px; padding-block: 24px; border-bottom: 1px solid var(--rule); margin: 0; }
.facts dt { font-size: var(--s-1); color: var(--muted); font-weight: 500; }
.facts dd { margin: 4px 0 0; }
.movements { display: flex; flex-wrap: wrap; gap: 6px 4px; margin: 0; padding: 0; list-style: none; }
.movements li { white-space: nowrap; }
.movements li:not(:last-child)::after { content: ","; color: var(--muted); }
.note { padding-block: 18px; color: var(--muted); max-width: 70ch; border-bottom: 1px solid var(--rule); margin: 0; font-style: italic; }

.recs-head { display: flex; flex-wrap: wrap; justify-content: space-between; align-items: center; gap: 12px; padding-block: 34px 14px; }
.recs-head h2 { font-family: var(--f-display); font-size: var(--s2); display: flex; align-items: baseline; gap: 12px; flex-wrap: wrap; }
.tools { display: flex; flex-wrap: wrap; gap: 12px; align-items: center; }
.search { display: flex; align-items: center; gap: 8px; }
.search input { font: inherit; font-size: 0.92rem; color: var(--ink); background: var(--sheet); border: 1px solid var(--rule); border-radius: 6px; padding: 6px 10px; width: 14rem; max-width: 60vw; }
.filters { display: flex; flex-wrap: wrap; gap: 6px; padding-bottom: 16px; }
.chip .n { font-family: var(--f-mono); font-weight: 400; opacity: 0.7; margin-left: 2px; }
.chip { font: 500 var(--s-1)/1 var(--f-body); padding: 8px 12px; border-radius: 999px; border: 1px solid var(--rule); background: transparent; color: var(--ink); cursor: pointer; }
.chip[aria-pressed="true"] { background: var(--ink); color: var(--paper); border-color: var(--ink); }
.sortbox { display: flex; align-items: center; gap: 8px; font-size: var(--s-1); color: var(--muted); }
.sortbox select { font: inherit; color: var(--ink); background: var(--sheet); border: 1px solid var(--rule); border-radius: 6px; padding: 6px 8px; }

.recs { list-style: none; margin: 0; padding: 0; display: grid; gap: 10px; }
.rec { display: grid; grid-template-columns: 6.5rem minmax(0, 1fr) auto; gap: 6px 20px; padding: 18px 20px; background: var(--sheet); border: 1px solid var(--rule); border-radius: 8px; }
.rec .yr { font-family: var(--f-display); font-size: 1.45rem; line-height: 1.1; }
.rec .yr.unknown { color: var(--muted); font-family: var(--f-body); font-size: var(--s0); }
.rec .who { min-width: 0; }
.rec .who h3 { font-family: var(--f-body); font-weight: 600; font-size: 1.075rem; }
.rec .meta { color: var(--muted); font-size: 0.92rem; }
.tags { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 8px; }
.tag { font-size: 0.78rem; font-weight: 500; padding: 3px 8px; border-radius: 4px; background: var(--prussian-soft); color: var(--prussian); }
.tag.draft { background: var(--draft-soft); color: var(--draft); }
.listen { display: flex; flex-direction: column; gap: 6px; align-items: flex-end; }
.listen a { display: inline-flex; align-items: center; gap: 8px; font-size: 0.875rem; font-weight: 600; text-decoration: none; padding: 7px 12px; border: 1px solid var(--prussian); border-radius: 6px; white-space: nowrap; }
.listen a:hover { background: var(--prussian-soft); }
.listen a span { font-weight: 400; color: var(--muted); }
details.help { grid-column: 2 / -1; font-size: 0.9rem; }
details.help summary { cursor: pointer; color: var(--draft); font-weight: 500; }
details.help ul { margin: 8px 0 0; padding-left: 1.2em; color: var(--muted); }
@media (max-width: 640px) {
  .rec { grid-template-columns: minmax(0, 1fr); }
  .listen { align-items: flex-start; flex-direction: row; flex-wrap: wrap; }
  details.help { grid-column: 1; }
}
.empty { padding: 24px; color: var(--muted); text-align: center; border: 1px dashed var(--rule); border-radius: 8px; }

/* contribute */
.prose { max-width: 68ch; padding-block: 36px; }
.prose h1 { font-family: var(--f-display); font-size: var(--s3); line-height: 1.05; margin-bottom: 18px; }
.prose h2 { font-family: var(--f-display); font-size: var(--s1); margin: 30px 0 8px; }
.prose ol { padding-left: 1.3em; }
.prose li { margin-bottom: 6px; }
.prose code { font-family: var(--f-mono); font-size: 0.88em; background: var(--sheet); border: 1px solid var(--rule); padding: 1px 5px; border-radius: 4px; }
pre.yaml { font-family: var(--f-mono); font-size: 0.85rem; line-height: 1.6; background: var(--sheet); border: 1px solid var(--rule); border-radius: 8px; padding: 16px; overflow-x: auto; }

footer.site { margin-top: 64px; padding-top: 16px; border-top: 1px solid var(--rule); font-size: var(--s-1); color: var(--muted); display: flex; flex-wrap: wrap; justify-content: space-between; gap: 8px; }
::view-transition-group(*) { animation-duration: 0.38s; animation-timing-function: cubic-bezier(0.3, 0.7, 0.2, 1); }
</style>

<div class="wrap">
  <header class="mast">
    <a class="brand" href="#">All Bach</a>
    <nav class="top" aria-label="Main">
      <a href="#" id="nav-cat">The shelf</a>
      <a href="#contribute" id="nav-con">Contribute</a>
    </nav>
  </header>
  <main id="app"></main>
  <footer class="site">
    <span>Catalogued by BWV number. Recording data is open, edited by contributors, and partly imported from <a href="https://musicbrainz.org" rel="noopener">MusicBrainz</a>.</span>
    <span id="built"></span>
  </footer>
</div>

<script>
const DATA = /*__DATA__*/null;

const INSTRUMENT = {
  "cello": "Cello", "baroque-cello": "Baroque cello", "violoncello-piccolo": "Violoncello piccolo",
  "violoncello-da-spalla": "Violoncello da spalla", "viola": "Viola", "viola-da-gamba": "Viola da gamba",
  "violin": "Violin", "baroque-violin": "Baroque violin", "guitar": "Guitar", "lute": "Lute", "harpsichord": "Harpsichord", "piano": "Piano",
  "organ": "Organ", "clavichord": "Clavichord", "fortepiano": "Fortepiano", "ensemble": "Ensemble", "voices-and-instruments": "Voices and instruments", "other": "Other"
};
const PRACTICE = { historical: "Period instruments", modern: "Modern instruments", unknown: "Practice not yet recorded" };
const PLATFORM = { "spotify": "Spotify", "apple-music": "Apple Music", "youtube": "YouTube", "youtube-music": "YouTube Music",
  "idagio": "Idagio", "qobuz": "Qobuz", "tidal": "Tidal", "deezer": "Deezer", "presto": "Presto Music", "label": "Label page",
  "archive-org": "Internet Archive", "musicbrainz": "MusicBrainz", "other": "Link" };

const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const slug = bwv => bwv.toLowerCase().replace(/anh\.\s?/, "anh-").replace(/\s+/g, "-");
const app = document.getElementById("app");
const state = { kind: "all", sort: "year", q: "", gq: "", glimit: 50 };

function recordingsFor(bwv) {
  return DATA.recordings.filter(r => r.works.some(w => w.bwv === bwv));
}
function firstYear(r) { return (r.recorded && r.recorded.years && r.recorded.years.length) ? Math.min(...r.recorded.years) : (r.released || null); }
function yearLabel(r) {
  const ys = (r.recorded && r.recorded.years) || [];
  if (ys.length) return ys.length > 1 ? `${Math.min(...ys)}–${String(Math.max(...ys)).slice(-2)}` : String(ys[0]);
  if (r.released) return `rel. ${r.released}`;
  return "";
}

// Bookcloth colours, one per collection in catalogue order; new collections take the next one.
const CLOTH = ["#2b4767", "#2e5143", "#6d2b2b", "#77612f", "#4b3651", "#3a4a58", "#5d3b22", "#2f4f55"];
const SPINE_H = [380, 356, 392, 344, 372, 362, 388, 350];
const FLAT = [["100%", "0%"], ["94%", "4%"], ["97%", "1%"], ["91%", "6%"], ["96%", "2%"]];
let COLLECTIONS = null;
const colSlug = name => fold(name).replace(/^the /, "").replace(/[^a-z0-9]+/g, "-").replace(/^-|-$/g, "");
function collections() {
  if (COLLECTIONS) return COLLECTIONS;
  const groups = [];
  for (const w of DATA.works) {
    let g = groups.find(g => g.name === w.collection);
    if (!g) groups.push(g = { name: w.collection, works: [] });
    g.works.push(w);
  }
  groups.forEach((g, i) => {
    g.slug = colSlug(g.name);
    g.cloth = CLOTH[i % CLOTH.length];
    g.i = i;
    const bwvs = new Set(g.works.map(w => w.bwv));
    g.recs = DATA.recordings.filter(r => r.works.some(w => bwvs.has(w.bwv)));
    const ys = g.recs.map(firstYear).filter(y => y);
    g.since = ys.length ? Math.min(...ys) : null;
    g.first = g.works[0].bwv; g.last = g.works[g.works.length - 1].bwv;
    g.grid = g.works.length > 12;
  });
  return (COLLECTIONS = groups);
}
const collectionOf = w => collections().find(g => g.name === w.collection);
const num = n => n.toLocaleString("en-GB");

function renderSpine(g) {
  const [mw, mo] = FLAT[g.i % FLAT.length];
  const lab = g.works.length > 1 ? `${esc(g.first)}<i>–</i>${esc(g.last)}` : esc(g.first);
  return `<li><a class="spine" href="#col-${g.slug}" style="--cloth:${g.cloth};--w:${Math.min(76 + g.works.length * 2, 128)}px;--h:${SPINE_H[g.i % SPINE_H.length]}px;--mw:${mw};--mo:${mo};--vt:vol-${g.slug}"
      aria-label="${esc(g.name)}, BWV ${esc(g.first)}${g.works.length > 1 ? " to " + esc(g.last) : ""}, ${g.recs.length} recordings">

    <span class="ft" aria-hidden="true">${num(g.recs.length)}<span>rec.</span></span>
  </a></li>`;
}

function renderCatalogue() {

function renderCollection(g) {
  const span = g.works.length > 1 ? `BWV ${esc(g.first)}–${esc(g.last)}` : `BWV ${esc(g.first)}`;
  const what = g.works.length === 1 ? "One work" : `${g.works.length} works`;
  return `

  </header>
  <ul class="works" style="--cloth:${g.cloth}">
    ${g.works.map(w => {
      const recs = recordingsFor(w.bwv);
      const ys = recs.map(firstYear).filter(y => y);
      const head = g.grid ? (w.key || w.title) : w.title;

      return `<li><a class="wcard" href="#bwv-${slug(w.bwv)}">

      </a></li>`;
    }).join("")}
  </ul>`;
}

/* ---------- search ---------- */
// Lower-case, strip accents, unify dashes, so "János", "Yo‐Yo" and "E♭" all compare plainly.
const fold = s => String(s ?? "").normalize("NFD").replace(/[̀-ͯ]/g, "")
  .replace(/[‐-―]/g, "-").replace(/[’']/g, " ").toLowerCase();
const KEY_RE = /(^|[\s,])([a-h])(\s*-?\s*(?:flat|sharp)|b|#|♭|♯|is|es|s)?\s*-?\s*(major|minor|dur|moll)(?=[\s,]|$)/;

// Reads "G major", "E-flat major", "Eb major", and German "Es-Dur", "fis-moll", "h-moll", "B-Dur".
function parseKey(text) {
  const m = fold(text).match(KEY_RE);
  if (!m) return null;
  let letter = m[2], acc = (m[3] || "").replace(/[\s-]/g, "");
  const german = m[4] === "dur" || m[4] === "moll";
  acc = ["flat", "b", "♭", "es", "s"].includes(acc) ? "flat" : ["sharp", "#", "♯", "is"].includes(acc) ? "sharp" : "";
  if (letter === "h") letter = "b";
  else if (german && letter === "b" && !acc) acc = "flat";
  return { letter, acc, mode: m[4] === "major" || m[4] === "dur" ? "major" : "minor", match: m[0] };
}
const keyLabel = k => k.letter.toUpperCase() + (k.acc ? "-" + k.acc : "") + " " + k.mode;
const sameKey = (a, b) => a && b && a.letter === b.letter && a.acc === b.acc && a.mode === b.mode;

function parseQuery(raw) {
  const q = { key: null, mode: null, years: [], bwv: [], text: [] };
  let s = fold(raw);
  const k = parseKey(s);
  if (k) { q.key = k; s = s.replace(k.match, " "); }
  for (let t of s.split(/[\s,]+/).filter(Boolean)) {
    let m;
    if (["major", "dur", "minor", "moll"].includes(t)) { if (!q.key) q.mode = t === "major" || t === "dur" ? "major" : "minor"; }
    else if ((m = t.match(/^(1[89]\d\d|20\d\d)s$/))) q.years.push([+m[1], +m[1] + 9]);
    else if ((m = t.match(/^(1[89]\d\d|20\d\d)-(1[89]\d\d|20\d\d)$/))) q.years.push([+m[1], +m[2]].sort((a, b) => a - b));
    else if ((m = t.match(/^(1[89]\d\d|20\d\d)$/))) q.years.push([+m[1], +m[1]]);
    else if ((m = t.match(/^(?:bwv)?([1-9]\d{0,2}[a-z]?|1[01]\d\d[a-z]?)$/))) q.bwv.push(m[1]);
    else if (t !== "bwv") q.text.push(t.replace(/-/g, " "));
  }
  return q;
}

let searchIndex = null;
const INSTRUMENT_WORDS = new Set(fold(Object.values(INSTRUMENT).join(" ") + " baroque period").split(/\s+/).filter(w => w.length > 2 && !["and", "other", "voices"].includes(w)));
function buildIndex() {
  const workKey = Object.fromEntries(DATA.works.map(w => [w.bwv, parseKey(w.key || "")]));
  return DATA.recordings.map(r => {
    const ys = r.recorded && r.recorded.years && r.recorded.years.length ? r.recorded.years : (r.released ? [r.released] : []);
    const hay = fold([
      ...r.performers.flatMap(p => [p.name, p.role]),
      INSTRUMENT[r.instrument] || "", r.instrument, r.recorded && r.recorded.place, r.notes,
      r.performance_practice === "historical" ? "period instruments baroque" : "",
      r.arrangement ? "arrangement transcription" : "",
    ].filter(Boolean).join(" | ")).replace(/-/g, " ");
    return { r, ys, hay, works: r.works.map(w => {
      const work = DATA.works.find(x => x.bwv === w.bwv);
      const moves = w.complete ? work.movements : (w.movements || []);
      const whay = fold([work.title, work.collection, ...moves].join(" | ")).replace(/-/g, " ")
        .replace(/ciaccona/g, "ciaccona chaconne").replace(/sarabanda/g, "sarabanda sarabande").replace(/giga/g, "giga gigue");
      return { ...w, key: workKey[w.bwv], hay: whay };
    }) };
  });
}

function runSearch(q) {
  searchIndex ||= buildIndex();
  const hits = [];
  for (const e of searchIndex) {
    // A word not found in the performer/instrument/place text must name a work or movement.
    // Instrument words ("violin", "baroque") only ever match the instrument actually played.
    if (q.text.some(t => INSTRUMENT_WORDS.has(t) && !e.hay.includes(t))) continue;
    const workWords = q.text.filter(t => !e.hay.includes(t));
    if (workWords.some(t => !e.works.some(w => w.hay.includes(t)))) continue;
    if (q.years.length && !e.ys.some(y => q.years.some(([a, b]) => y >= a && y <= b))) continue;
    const works = e.works.filter(w =>
      workWords.every(t => w.hay.includes(t)) &&
      (!q.bwv.length || q.bwv.includes(w.bwv)) &&
      (!q.key || sameKey(q.key, w.key)) &&
      (!q.mode || (w.key && w.key.mode === q.mode)));
    if (works.length) hits.push({ ...e, works });
  }
  return hits.sort((a, b) => {
    const ya = firstYear(a.r), yb = firstYear(b.r);
    if (ya !== yb) return ya === null ? 1 : yb === null ? -1 : ya - yb;
    return a.r.performers[0].name.localeCompare(b.r.performers[0].name);
  });
}

function describe(q) {
  const parts = [];
  if (q.text.length) parts.push(`Text “${esc(q.text.join(" "))}”`);
  q.years.forEach(([a, b]) => parts.push(a === b ? `Recorded ${a}` : `Recorded ${a}–${b}`));
  if (q.key) parts.push(`Key ${keyLabel(q.key)}`);
  if (q.mode) parts.push(`Any ${q.mode} key`);
  q.bwv.forEach(b => parts.push(`BWV ${esc(b)}`));
  return parts.map(p => `<span class="tag">${p}</span>`).join("");
}

// One chip per work; when a recording holds more than six works of one collection
// (a whole book of the Well-Tempered Clavier), one chip for the collection instead.
function workChips(works) {
  const groups = [];
  for (const w of works) {
    const work = DATA.works.find(x => x.bwv === w.bwv);
    let g = groups.find(g => g.name === work.collection);
    if (!g) groups.push(g = { name: work.collection, items: [] });
    g.items.push({ w, work });
  }
  return groups.map(g => {
    if (g.items.length > 6) {
      const total = DATA.works.filter(x => x.collection === g.name).length;
      const done = g.items.filter(i => i.w.complete).length;
      const first = g.items[0].w.bwv, last = g.items[g.items.length - 1].w.bwv;
      return `<a class="wchip" href="#bwv-${slug(first)}" title="${esc(g.name)}"><b class="mono">${esc(first)}–${esc(last)}</b> ${esc(g.name.replace(/^The /, ""))} · ${g.items.length === total && done === total ? "complete" : `${g.items.length} of ${total}`}</a>`;
    }
    return g.items.map(({ w, work }) =>
      `<a class="wchip" href="#bwv-${slug(w.bwv)}" title="${esc(work.title)}${w.complete ? "" : " (excerpt)"}"><b class="mono">${esc(w.bwv)}</b> ${esc(work.key || "")}${w.complete ? "" : " <i>part</i>"}</a>`).join("");
  }).join("");
}

function renderHit(h) {
  const r = h.r, yl = yearLabel(r);
  const where = [r.recorded && r.recorded.place, r.original_label].filter(Boolean).join(" · ");
  const inst = r.instrument === "unknown" ? "" : (INSTRUMENT[r.instrument] || r.instrument);
  const meta = [r.instrument === "other" ? r.performers.map(p => p.role).join(", ") : inst, where].filter(Boolean).join(" · ");
  const link = r.links.find(l => l.platform !== "musicbrainz") || r.links[0];
  return `<li class="hit">
    <span class="yr mono ${yl ? "" : "unknown"}">${yl ? esc(yl) : "Year?"}</span>
    <div class="who"><strong>${r.performers.map(p => esc(p.name)).join(", ")}</strong>${meta ? `<div class="meta">${esc(meta)}</div>` : ""}</div>
    <div class="wk">${workChips(h.works)}</div>
    <div class="listen">${link ? `<a href="${esc(link.url)}" rel="noopener">${esc(PLATFORM[link.platform] || link.platform)}</a>` : ""}</div>
  </li>`;
}

function updateSearch() {
  const box = document.getElementById("gq-results");
  if (!box) return;
  const index = document.getElementById("catalogue-index");
  const tryLine = document.getElementById("gq-try");
  const raw = state.gq.trim();
  box.hidden = !raw; index.hidden = !!raw; tryLine.hidden = !!raw;
  if (!raw) { box.innerHTML = ""; return; }
  const q = parseQuery(raw);
  const hits = runSearch(q);
  const shown = hits.slice(0, state.glimit);
  box.innerHTML = `
    <div class="hits-head">
      <p><b class="mono">${hits.length}</b> recording${hits.length === 1 ? "" : "s"}</p>
      <div class="tags">${describe(q)}</div>
    </div>
    ${hits.length ? `<ul class="hits">${shown.map(renderHit).join("")}</ul>` :
      `<p class="empty">Nothing matches all of these. Remove a term, or search a year range like 1950-1970.</p>`}
    ${hits.length > shown.length ? `<button class="chip more" type="button" id="gq-more">Show all ${hits.length}</button>` : ""}`;
}

function renderWork(w) {
  const g = collectionOf(w);
  const all = recordingsFor(w.bwv);
  const partOf = r => r.works.find(x => x.bwv === w.bwv);
  const kinds = {
    all: () => true,
    complete: r => !r.arrangement && partOf(r).complete,
    excerpt: r => !r.arrangement && !partOf(r).complete,
    period: r => r.performance_practice === "historical",
    arrangement: r => r.arrangement,
  };
  const count = k => all.filter(kinds[k]).length;
  const q = state.q.trim().toLowerCase();
  let recs = all.filter(kinds[state.kind]).filter(r => !q || r.performers.some(p => p.name.toLowerCase().includes(q)));
  recs = recs.slice().sort((a, b) => {
    if (state.sort === "performer") return a.performers[0].name.localeCompare(b.performers[0].name);
    const ya = firstYear(a), yb = firstYear(b);
    if (ya === null && yb === null) return a.performers[0].name.localeCompare(b.performers[0].name);
    if (ya === null) return 1; if (yb === null) return -1;
    return ya - yb;
  });
  const chip = (val, text) => count(val) ? `<button class="chip" type="button" data-kind="${val}" aria-pressed="${state.kind === val}">${text} <span class="n">${count(val)}</span></button>` : "";
  const links = [];
  if (w.links && w.links.wikipedia) links.push(`<a href="${esc(w.links.wikipedia)}" rel="noopener">Wikipedia</a>`);
  if (w.links && w.links.bach_digital) links.push(`<a href="${esc(w.links.bach_digital)}" rel="noopener">Bach Digital</a>`);
  if (w.links && w.links.imslp) links.push(`<a href="${esc(w.links.imslp)}" rel="noopener">Score (IMSLP)</a>`);

  return `
  <a class="back" href="#col-${g.slug}">← ${esc(g.name.replace(/^The /, ""))}</a>
  <section class="sheet" style="--cloth:${g.cloth}">
    <div class="bwv inked"><small>BWV</small>${esc(w.bwv)}</div>
    <div>${w.collection !== w.title ? `<div class="col">From <a href="#col-${g.slug}">${esc(w.collection)}</a></div>` : ""}<h1>${esc(w.title)}</h1><div class="key">${esc(w.key || "")}</div></div>
  </section>
  <dl class="facts">
    <div><dt>Scoring</dt><dd>${esc(w.scoring)}</dd></div>
    <div><dt>Composed</dt><dd>${esc(w.composed || "Unknown")}</dd></div>
    <div><dt>Movements</dt><dd><ul class="movements">${w.movements.map(m => `<li>${esc(m)}</li>`).join("")}</ul></dd></div>
    ${links.length ? `<div><dt>Read more</dt><dd>${links.join(", ")}</dd></div>` : ""}
  </dl>
  ${w.notes ? `<p class="note">${esc(w.notes)}</p>` : ""}
  <div class="recs-head">
    <h2>Recordings <span class="label">${recs.length === all.length ? num(all.length) : `${num(recs.length)} of ${num(all.length)}`}</span></h2>
    <div class="tools">
      <label class="search" for="q"><span class="label">Performer</span>
        <input id="q" type="search" placeholder="Search by name" value="${esc(state.q)}" autocomplete="off">
      </label>
      <label class="sortbox" for="sort">Sort
        <select id="sort">
          <option value="year"${state.sort === "year" ? " selected" : ""}>By year</option>
          <option value="performer"${state.sort === "performer" ? " selected" : ""}>By performer</option>
        </select>
      </label>
    </div>
  </div>
  <div class="filters" role="group" aria-label="Filter recordings">
    ${chip("all", "All")}${chip("complete", "Complete work")}${chip("excerpt", "Excerpts")}${chip("period", "Period instruments")}${chip("arrangement", "Other instruments")}
  </div>
  ${recs.length ? `<ul class="recs">${recs.map(r => renderRec(r, w)).join("")}</ul>` : `<p class="empty">No recordings match. Try another filter or name.</p>`}`;
}

function renderRec(r, w) {
  const part = r.works.find(x => x.bwv === w.bwv);
  const yl = yearLabel(r);
  const where = [r.recorded && r.recorded.place, r.original_label].filter(Boolean).join(" · ");
  const tags = [];
  if (r.instrument !== "unknown") tags.push(`<span class="tag">${esc(INSTRUMENT[r.instrument] || r.instrument)}</span>`);
  if (r.performance_practice !== "unknown") tags.push(`<span class="tag">${esc(PRACTICE[r.performance_practice])}</span>`);
  if (r.arrangement) tags.push(`<span class="tag">Arrangement${r.arranger ? " · " + esc(r.arranger) : ""}</span>`);
  if (part && !part.complete) tags.push(`<span class="tag">Excerpt: ${esc(part.movements.join(", "))}</span>`);
  if (r.status === "draft") tags.push(`<span class="tag draft">Draft</span>`);
  const help = (r.help_wanted || []);
  return `<li class="rec">
    <div class="yr ${yl ? "" : "unknown"}">${yl ? esc(yl) : "Year?"}</div>
    <div class="who">
      <h3>${r.performers.map(p => esc(p.name)).join(", ")}</h3>
      <div class="meta">${r.performers.map(p => esc(p.role)).join(", ")}${where ? " · " + esc(where) : ""}</div>
      ${r.notes ? `<div class="meta">${esc(r.notes)}</div>` : ""}
      <div class="tags">${tags.join("")}</div>
    </div>
    <div class="listen">${r.links.map(l => `<a href="${esc(l.url)}" rel="noopener" title="${esc(l.title || "")}">${esc(PLATFORM[l.platform] || l.platform)} <span>${esc(l.kind)}</span></a>`).join("")}</div>
    ${help.length ? `<details class="help"><summary>${help.length} fact${help.length === 1 ? "" : "s"} missing — can you help?</summary><ul>${help.map(h => `<li>${esc(h)}</li>`).join("")}</ul></details>` : ""}
  </li>`;
}

function renderContribute() {
  const repo = DATA.repo_url;
  return `<article class="prose">
    <h1>Add a recording</h1>
    <p>Everything on this site comes from small text files, one per work and one per recording. Adding a recording means adding one file and opening a pull request${repo ? ` on <a href="${esc(repo)}" rel="noopener">GitHub</a>` : " on GitHub"}. A check runs automatically and tells you if anything is missing.</p>
    <h2>What counts as one recording</h2>
    <p>One performance, recorded once. A remaster or a box-set reissue of the same performance is another link on the same recording, not a new entry. A cellist who recorded the suites twice gets two entries.</p>
    <h2>Steps</h2>
    <ol>
      <li>Check the work's page here to see whether the recording is already listed.</li>
      <li>Copy an existing file in <code>data/recordings/</code> and name it after the main performer and the recording year, for example <code>fournier-1960.yaml</code>.</li>
      <li>Fill in what you know. Leave unknown facts empty and list them under <code>help_wanted</code>.</li>
      <li>Paste listening links without tracking parameters (everything after the <code>?</code>).</li>
      <li>Open a pull request. A second contributor checks the facts against the booklet or label and changes <code>status</code> from <code>draft</code> to <code>reviewed</code>.</li>
    </ol>
    <h2>Example</h2>
<pre class="yaml">id: fournier-1960
performers:
  - name: Pierre Fournier
    role: cello
instrument: cello
performance_practice: modern
arrangement: false
recorded:
  years: [1960]
  place: null
works:
  - { bwv: "1007", complete: true }
  - { bwv: "1009", complete: false, movements: [Prélude, Sarabande] }
links:
  - platform: spotify
    kind: album
    url: https://open.spotify.com/album/...
status: draft
help_wanted:
  - Recording place</pre>
    <h2>Fixing a fact</h2>
    <p>Each draft recording lists the facts it is missing. If you can confirm one from a booklet, a label catalogue or a discography, edit the file and say where the fact came from in the pull request.</p>
  </article>`;
}

function route() {
  const h = location.hash.replace(/^#/, "");
  let html, current = "cat";
  if (h === "contribute") { html = renderContribute(); current = "con"; }
  else if (h.startsWith("col-")) {
    const g = collections().find(g => g.slug === h.slice(4));
    html = g ? renderCollection(g) : `<p class="empty">That volume is not on the shelf. <a href="#">Back to the shelf</a></p>`;
  } else if (h.startsWith("bwv-")) {
    const w = DATA.works.find(x => slug(x.bwv) === h.slice(4));
    html = w ? renderWork(w) : `<p class="empty">No work with that BWV number yet. <a href="#">Back to the shelf</a></p>`;
  } else html = renderCatalogue();
  app.innerHTML = `<div class="view">${html}</div>`;
  updateSearch();
  for (const [id, key] of [["nav-cat", "cat"], ["nav-con", "con"]]) {
    const el = document.getElementById(id);
    if (current === key) el.setAttribute("aria-current", "page"); else el.removeAttribute("aria-current");
  }
}

app.addEventListener("click", e => {
  const t = e.target.closest("[data-try]");
  if (t) {
    state.gq = t.dataset.try; state.glimit = 50;
    const input = document.getElementById("gq");
    input.value = state.gq; updateSearch(); input.focus();
    return;
  }
  if (e.target.closest("#gq-more")) { state.glimit = Infinity; updateSearch(); return; }
  const b = e.target.closest("[data-kind]");
  if (!b) return;
  state.kind = b.dataset.kind;
  route();
  document.querySelector(`[data-kind="${state.kind}"]`)?.focus();
});
app.addEventListener("change", e => {
  if (e.target.id === "sort") { state.sort = e.target.value; route(); document.getElementById("sort").focus(); }
});
document.addEventListener("keydown", e => {
  const tag = (e.target.tagName || "").toLowerCase();
  if (e.key === "/" && !["input", "select", "textarea"].includes(tag) && document.getElementById("gq")) {
    e.preventDefault(); document.getElementById("gq").focus();
  }
});
app.addEventListener("input", e => {
  if (e.target.id === "gq") { state.gq = e.target.value; state.glimit = 50; updateSearch(); return; }
  if (e.target.id !== "q") return;
  const pos = e.target.selectionStart;
  state.q = e.target.value;
  route();
  const q = document.getElementById("q");
  q.focus(); q.setSelectionRange(pos, pos);
});
// Opening a volume grows its spine into the cover (where the browser supports view transitions).
window.addEventListener("hashchange", () => {
  state.kind = "all"; state.q = "";
  const go = () => { route(); window.scrollTo(0, 0); };
  if (document.startViewTransition && !matchMedia("(prefers-reduced-motion: reduce)").matches) document.startViewTransition(go);
  else go();
});
document.getElementById("built").textContent = DATA.built ? "Data updated " + DATA.built : "";
route();
</script>
