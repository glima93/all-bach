name: Collector test
on:
  push:
    branches: [collect-test]
    paths: [.github/workflows/collect-test.yml, scripts/collect_musicbrainz.py]
permissions:
  contents: write
concurrency:
  group: musicbrainz
  cancel-in-progress: false
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: pip install pyyaml requests
      - run: python scripts/collect_musicbrainz.py --collection brandenburg --no-whole --budget-minutes 75 --state .t --out .t/out
      - run: |
          mkdir -p test-output && cp .t/out/brandenburg/* test-output/ 2>/dev/null || true
          cp .t/state-brandenburg.json test-output/ 2>/dev/null || true
          git config user.name "All Bach collector"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f test-output && git commit -m "Collector test output [skip ci]" && git push origin HEAD:collect-test
